services:
  database:
    image: postgres:18
    container_name: or-scheduler-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orscheduler}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orscheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - or-network

  or-scheduler-algorithm:
    build:
      context: ./or-scheduler-algorithm
    container_name: or-scheduler-algorithm
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "apt-get update && apt-get install -y curl && curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - or-network

  or-scheduler-core:
    build:
      context: ./or-scheduler-core
    container_name: or-scheduler-core
    depends_on:
      database:
        condition: service_healthy
      or-scheduler-algorithm:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://database:5432/orscheduler}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS}
      ALGORITHM_URL: http://or-scheduler-algorithm:8000
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://database:5432/orscheduler}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      RABBITMQ_HOST: rabbitmq
      UI_URL: ${UI_URL:-http://localhost:4200}
    networks:
      - or-network

  or-scheduler-ui:
    build:
      context: ./or-scheduler-ui
    container_name: or-scheduler-ui
    ports:
      - "80:80"
    depends_on:
      - or-scheduler-core
    networks:
      - or-network

  rabbitmq:
    build:
      context: ./rabbitmq
    container_name: or-scheduler-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
      # Port 61613 (STOMP) removed from host mapping to avoid Windows conflicts. 
      # It remains accessible internally for the backend.
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - or-network

networks:
  or-network:
    driver: bridge

volumes:
  postgres_data:
