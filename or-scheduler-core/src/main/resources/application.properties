spring.application.name=or-scheduler-core

# Database Configuration - PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orscheduler}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Explicit server binding to avoid localhost/IPv6 binding issues when testing from tools
# Bind to all interfaces so Postman/curl on 127.0.0.1 can connect reliably
server.address=0.0.0.0
server.port=8080

# Enable debug logging for authentication/database during development when needed
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
