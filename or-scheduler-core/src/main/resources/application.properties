spring.application.name=or-scheduler-core

# Database Configuration - PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${LOCAL_DB_URL:jdbc:postgresql://127.0.0.1:5435/orscheduler}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1q2w3e}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Explicit server binding to avoid localhost/IPv6 binding issues when testing from tools
# Bind to all interfaces so Postman/curl on 127.0.0.1 can connect reliably
server.address=0.0.0.0
server.port=8080

# Disable Tomcat session persistence to prevent java.io.StreamCorruptedException across restarts
server.servlet.session.persistent=false
server.forward-headers-strategy=native

# Enable debug logging for authentication/database during development when needed
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO

# Enable DEBUG for CookieBearerTokenFilter and Security Web
logging.level.octacare.orschedulercore.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG

# Enable JWT/Bearer token debugging
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.jwt=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG

# UI Configuration
app.ui-url=${UI_URL:http://localhost:4200}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=orscheduler.noreply@gmail.com
spring.mail.password=cmiwswtffvoqpcrw
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}