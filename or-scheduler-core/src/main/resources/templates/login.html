<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OR Scheduler - Login</title>
    <!-- Legăm fișierul de CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<div class="login-wrapper">
    <div class="login-form-panel">
        <div class="login-block-drift">
            <h1 class="login-page-title">OR Scheduler</h1>

            <div class="form-container">
                <div class="form-header">
                    <h1 class="form-title">Welcome back!</h1>
                    <p class="form-subtitle">Sign in to your account to continue</p>
                </div>

                <!-- Aici e magia: un form clasic care face POST la /login -->
                <form th:action="@{/login}" method="post" class="form-body">

                    <!-- Mesaj de eroare injectat dinamic de Spring Security dacă parola e greșită -->
                    <div class="error-message" th:if="${param.error}" style="margin-bottom: 15px; color: #dc3545;">
                        <svg viewBox="0 0 20 20" fill="currentColor" style="width: 20px; vertical-align: middle;">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <span>Incorrect email or password.</span>
                    </div>

                    <div class="field-group">
                        <label for="username">Email</label>
                        <div class="input-wrapper">
                            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                            </svg>
                            <!-- IMPORTANT: name-ul trebuie să fie neapărat 'username' -->
                            <input id="username" type="email" name="username" placeholder="name@hospital.com" autocomplete="email" required autofocus/>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            <!-- IMPORTANT: name-ul trebuie să fie 'password' -->
                            <input id="password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required/>
                        </div>
                    </div>

                    <button class="login-btn" type="submit">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="javascript:void(0)">Contact your administrator</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
