<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OR Scheduler - Login</title>
    <!-- Aici încărcăm fișierul CSS din src/main/resources/static/css/login.css -->
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body class="login-wrapper">
    <!-- ELEMENTE DE DECOR (Bulele animate din CSS) -->
    <div class="panel-bubble-blue"></div>
    <div class="panel-bubble-blue-2"></div>

    <div class="login-form-panel">
        <div class="login-block-drift">
            <h1 class="login-page-title"><span class="logo-text" style="font-family: var(--font-stack), sans-serif;">OR SCHEDULER</span></h1>

            <div class="form-container">
                <div class="form-header">
                    <h1 class="form-title">Welcome back!</h1>
                    <p class="form-subtitle">Sign in to your account to continue</p>
                </div>

                <form th:action="@{/login}" method="post" class="form-body">
                    <!-- Mesaj eroare Spring Security -->
                    <div class="error-message" th:if="${param.error}" style="display: flex; align-items: center; gap: 8px; color: #dc3545; background: rgba(220, 53, 69, 0.1); padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 14px;">
                        <svg viewBox="0 0 20 20" fill="currentColor" style="width: 20px; flex-shrink: 0;">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                        <span>Incorrect email or password.</span>
                    </div>

                    <div class="field-group">
                        <label for="username">Email</label>
                        <div class="input-wrapper">
                            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                            </svg>
                            <input id="username" type="email" name="username" placeholder="name@hospital.com" required autofocus/>
                        </div>
                    </div>

                    <div class="field-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                            <input id="password" type="password" name="password" placeholder="Enter your password" required/>

                            <!-- Buton Toggle Password -->
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <svg id="eye-icon" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                                </svg>
                            </button>
                        </div>
                        <div class="forgot-row">
                            <a class="forgot-link" href="#">Forgot password?</a>
                        </div>
                    </div>

                    <button class="login-btn" type="submit">
                        <span>Sign In</span>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="#">Contact your administrator</a></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Script mic pentru a emula comportamentul de Toggle Password din Angular -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        }
    </script>
</body>
</html>
