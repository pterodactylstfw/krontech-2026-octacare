<div class="login-wrapper">
  <div class="bg-gradient"></div>

  <div class="login-card">

    <div class="login-header">
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <circle cx="18" cy="18" r="18" fill="url(#grad)"/>
          <path d="M18 8v10l6 3" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M11 13h2M11 18h2M11 23h2" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="36" y2="36">
              <stop offset="0%" stop-color="#2563EB"/>
              <stop offset="100%" stop-color="#0EA5E9"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="app-title">OR Scheduler</h1>
      <p class="app-subtitle">Log in to your account</p>
    </div>

    <div class="login-form">

      <div class="field-group">
        <label>EMAIL ADDRESS</label>
        <div class="input-wrapper">
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="name@spital.ro"
            autocomplete="email"
          />
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <div class="field-group">
        <label>PASSWORD</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button class="input-icon toggle-pass" (click)="togglePassword()" type="button">
            {{ showPassword ? '🙈' : '🙉' }}
          </button>
        </div>
        <div class="forgot-row">
          <span class="forgot-link">Forgot password?</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        class="login-btn"
        (click)="onLogin()"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">LOG IN →</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="login-footer">
        <p>Don't have an account?</p>
        <p class="contact-admin">Contact your Administrator</p>
      </div>

    </div>
  </div>
</div>
