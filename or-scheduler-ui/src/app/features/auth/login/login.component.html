<div class="login-wrapper">
  <div class="bg-gradient"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <img src="/assets/images/Logo.jpeg" alt="Logo" class="logo-image" />
      </div>
      <h1 class="app-title">OR Scheduler</h1>
      <p class="app-subtitle">Log in to your account</p>
    </div>

    <div class="login-form">
      <div class="field-group">
        <label>Email address</label>
        <div class="input-wrapper">
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="name@hospital.com"
            autocomplete="email"
          />
          <span class="input-icon">✉️</span>
        </div>
      </div>

      <div class="field-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button class="input-icon toggle-pass" (click)="togglePassword()" type="button">
            {{ showPassword ? '🙈' : '🙉' }}
          </button>
        </div>
        <div class="forgot-row">
          <span class="forgot-link">Forgot your password?</span>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button class="login-btn" (click)="onLogin()" [disabled]="isLoading">
        <span *ngIf="!isLoading">LOG IN →</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="login-footer">
        <p>Don't have an account?</p>
        <p class="contact-admin">Contact your administrator</p>
      </div>

    </div>
  </div>
</div>
