<div class="login-wrapper">
  <div class="panel-bubble-blue"></div>
  <div class="panel-bubble-blue-2"></div>

  <div class="login-form-panel">
    <div class="login-block-drift">
      <h1 class="login-page-title">
        <span class="logo-text">OR SCHEDULER</span>
      </h1>

      <div class="form-container">

        <ng-container *ngIf="!submitted">
          <div class="form-header">
            <h1 class="form-title-static">Forgot password?</h1>
            <p class="form-subtitle">Enter your email and we'll send you a reset link</p>
          </div>

          <div class="form-body">
            <div class="field-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                  <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                </svg>
                <input id="email" type="email" [(ngModel)]="email"
                       placeholder="name@hospital.com"/>
              </div>
            </div>

            <button class="login-btn" (click)="onSubmit()" [disabled]="isLoading || !email">
              <span *ngIf="!isLoading">Send Reset Link</span>
              <span *ngIf="isLoading">Sending...</span>
            </button>

            <button class="back-btn" (click)="backToLogin()">← Back to Login</button>
          </div>
        </ng-container>

        <ng-container *ngIf="submitted">
          <div class="form-header">
            <div class="success-icon">✓</div>
            <h1 class="form-title-static">Check your email</h1>
            <p class="form-subtitle">
              If <strong>{{ email }}</strong> exists in our system, you'll receive a reset link shortly.
            </p>
          </div>
          <button class="login-btn" (click)="backToLogin()">Back to Login</button>
        </ng-container>

      </div>
    </div>
  </div>
</div>
