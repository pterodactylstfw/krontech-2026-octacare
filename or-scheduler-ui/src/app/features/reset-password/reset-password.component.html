<div class="login-wrapper">
  <div class="panel-bubble-blue"></div>
  <div class="panel-bubble-blue-2"></div>

  <div class="login-form-panel">
    <div class="login-block-drift">
      <h1 class="login-page-title">
        <span class="logo-text">OR SCHEDULER</span>
      </h1>

      <div class="form-container">

        <!-- Eroare token invalid -->
        <ng-container *ngIf="!token">
          <div class="form-header">
            <div class="error-icon">✕</div>
            <h1 class="form-title-static">Invalid Link</h1>
            <p class="form-subtitle">This reset link is invalid or has expired.</p>
          </div>
          <button class="login-btn" (click)="backToLogin()">Back to Login</button>
        </ng-container>

        <!-- Formular reset -->
        <ng-container *ngIf="token && !submitted">
          <div class="form-header">
            <h1 class="form-title-static">Reset Password</h1>
            <p class="form-subtitle">Enter your new password below</p>
          </div>

          <div class="form-body">
            <div *ngIf="errorMessage" class="error-message">
              {{ errorMessage }}
            </div>

            <div class="field-group">
              <label for="newPassword">New Password</label>
              <div class="input-wrapper">
                <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                </svg>
                <input id="newPassword" [type]="showPassword ? 'text' : 'password'"
                       [(ngModel)]="newPassword" placeholder="Enter new password"/>
                <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                  <svg viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                  </svg>
                </button>
              </div>
            </div>

            <div class="field-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="input-wrapper">
                <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                </svg>
                <input id="confirmPassword" [type]="showConfirm ? 'text' : 'password'"
                       [(ngModel)]="confirmPassword" placeholder="Confirm new password"/>
                <button type="button" class="toggle-password" (click)="showConfirm = !showConfirm">
                  <svg viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                  </svg>
                </button>
              </div>
              <span class="match-hint" *ngIf="confirmPassword && !passwordsMatch">
                Passwords do not match
              </span>
            </div>

            <button class="login-btn" (click)="onSubmit()"
                    [disabled]="isLoading || !newPassword || !confirmPassword || !passwordsMatch">
              <span *ngIf="!isLoading">Reset Password</span>
              <span *ngIf="isLoading">Resetting...</span>
            </button>

            <button class="back-btn" (click)="backToLogin()">← Back to Login</button>
          </div>
        </ng-container>

        <!-- Succes -->
        <ng-container *ngIf="submitted">
          <div class="form-header">
            <div class="success-icon">✓</div>
            <h1 class="form-title-static">Password Reset!</h1>
            <p class="form-subtitle">Your password has been updated successfully.</p>
          </div>
          <button class="login-btn" (click)="backToLogin()">Back to Login</button>
        </ng-container>

      </div>
    </div>
  </div>
</div>
